# Libseat reverse-proxy server block.
# Copy to /etc/nginx/sites-available/phagendra and symlink into sites-enabled.
# Replace SERVER_NAME with your API domain/host.

server {
    listen 80;
    server_name api.phagendrababulibrary.in;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # All API traffic -> gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # Django media (Aadhaar/photo uploads). Optional auth here if you want
    # these files non-public — see docs/PRODUCTION-DEPLOYMENT.md.
    location /media/ {
        alias /opt/phagendra/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django static via WhiteNoise is served by gunicorn, but letting nginx
    # serve it is faster. Run `collectstatic` to fill /staticfiles first.
    location /static/ {
        alias /opt/phagendra/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
              application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 10m;

    # Basic protection
    server_tokens off;
}

# HTTPS block (after `certbot --nginx` fills this in automatically, or use the
# standalone server block + certbot --webroot).
